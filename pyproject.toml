[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "derm-skintone-audit"
version = "1.0.0"
description = "A reproducible data-engineering pipeline for auditing and correcting skin-tone bias in dermatology image-recognition datasets"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Juby Mathew", email = "jubymathew@amaljyothi.ac.in" }]
keywords = ["dermatology", "fairness", "skin tone", "dataset auditing",
            "individual typology angle", "medical imaging"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "numpy>=1.24", "pandas>=2.0", "scipy>=1.11", "scikit-learn>=1.3",
  "matplotlib>=3.7", "Pillow>=10.0", "pyyaml>=6.0", "jsonschema>=4.19",
]

[project.optional-dependencies]
train = ["torch>=2.1", "torchvision>=0.16", "timm>=0.9", "transformers>=4.35"]
dev = ["pytest>=7.4", "ruff>=0.1"]

[project.urls]
Homepage = "https://github.com/YOUR-GITHUB-USERNAME/derm-skintone-audit"
Repository = "https://github.com/YOUR-GITHUB-USERNAME/derm-skintone-audit"
Issues = "https://github.com/YOUR-GITHUB-USERNAME/derm-skintone-audit/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
